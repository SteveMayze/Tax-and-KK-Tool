---
# Wires Caddy to the app WITHOUT touching the other app's routes: a self-contained snippet in
# /etc/caddy/conf.d plus one `import` line in the shared Caddyfile (backed up first, validated, restored on failure).
# Run with:  make caddy       Undo with:  make caddy-remove
- name: Configure Caddy for tax-healthcare-tool
  hosts: taxtool
  gather_facts: false
  vars:
    caddyfile: /etc/caddy/Caddyfile
    conf_dir: /etc/caddy/conf.d
    snippet: "{{ conf_dir }}/{{ app_name }}.caddy"
    import_line: "import {{ conf_dir }}/*.caddy"
  tasks:
    - name: Caddy must already be installed (nothing is installed by this playbook)
      ansible.builtin.command: caddy version
      changed_when: false

    - name: Create the snippet directory
      become: true
      ansible.builtin.file:
        path: "{{ conf_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the site snippet
      become: true
      ansible.builtin.template:
        src: caddy-site.caddy.j2
        dest: "{{ snippet }}"
        owner: root
        group: root
        mode: "0644"
      register: snippet_result

    - name: Add the import line to the Caddyfile and check the result
      block:
        - name: Add the import line (a timestamped backup of the Caddyfile is made when it changes)
          become: true
          ansible.builtin.lineinfile:
            path: "{{ caddyfile }}"
            line: "{{ import_line }}"
            insertafter: EOF
            backup: true
          register: import_result

        - name: Validate the complete configuration (as the caddy user)
          become: true
          become_user: caddy
          ansible.builtin.command: "caddy validate --config {{ caddyfile }} --adapter caddyfile"
          changed_when: false
      rescue:
        - name: "Validation failed, restoring the previous Caddyfile"
          become: true
          ansible.builtin.copy:
            src: "{{ import_result.backup }}"
            dest: "{{ caddyfile }}"
            remote_src: true
          when: import_result is defined and import_result.backup is defined

        - name: Remove the snippet again so a failed run leaves nothing behind
          become: true
          ansible.builtin.file:
            path: "{{ snippet }}"
            state: absent
          when: snippet_result is changed

        - name: Stop
          ansible.builtin.fail:
            msg: "Caddy validation failed; the Caddyfile was restored and the snippet removed. Nothing was reloaded."

    - name: Reload Caddy (graceful, no restart) when something changed
      become: true
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
      when: snippet_result is changed or import_result is changed

    - name: Check the app through Caddy (certificate is from Caddy's local CA, so it is not verified here)
      delegate_to: localhost
      ansible.builtin.uri:
        url: "https://{{ public_host }}:{{ public_port }}/health/"
        validate_certs: false
        status_code: 200
      register: via_caddy
      retries: 10
      delay: 3
      until: via_caddy.status == 200

    - name: Next step
      ansible.builtin.debug:
        msg: "Open https://{{ public_host }}:{{ public_port }}/ . To trust the certificate, run: make caddy-root-cert"
