---
# Copies Caddy's local root certificate (public, not secret) to local/ so you can trust it in your browser/Keychain.
- name: Fetch Caddy's local root certificate
  hosts: taxtool
  gather_facts: false
  vars:
    cert_path: /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt
  tasks:
    - name: Does the certificate exist yet? (created when Caddy first serves a `tls internal` site)
      become: true
      ansible.builtin.stat:
        path: "{{ cert_path }}"
      register: root

    - name: Stop if not found
      ansible.builtin.fail:
        msg: "No local root certificate yet. Run `make caddy` first and open the site once."
      when: not root.stat.exists

    - name: Fetch it
      become: true
      ansible.builtin.fetch:
        src: "{{ cert_path }}"
        dest: "{{ playbook_dir }}/../local/caddy-local-root.crt"
        flat: true

    - name: How to trust it on macOS
      ansible.builtin.debug:
        msg: "sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain local/caddy-local-root.crt"
