---
# Points the app back at the OLD folders in the home folder (ADR 0035).  make rollback-storage
# Meant for use soon after make relocate-storage, while the old folders are still the kept copy. Changes made since the
# relocation exist only on /u01: a verified backup of the current state is taken first (on /u01), so they can be
# restored afterwards with make restore. Nothing is deleted or moved; the copy on /u01 stays where it is.
- name: Roll the tax-healthcare-tool storage back to the home folder
  hosts: taxtool
  gather_facts: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ service_uid | default('') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ service_uid | default('') }}/bus"
  vars:
    use_u01: true                                          # the CURRENT layout, for the checks and the safety backup
  tasks:
    - name: Connected as the service user, with linger on and a running user systemd
      ansible.builtin.include_tasks: tasks/service-session.yml

    - name: The server must use the /u01 layout now, with the disk mounted (nothing was changed otherwise)
      ansible.builtin.include_tasks: tasks/storage-check.yml

    - name: The old folders must still be there
      ansible.builtin.stat:
        path: "{{ legacy_root }}/{{ item }}"
        get_checksum: false
      loop: [data, uploads, backups]
      register: old_dirs

    - name: Assert they exist (nothing was changed)
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.isdir
        fail_msg: "{{ legacy_root }}/{{ item.item }} is gone, so there is nothing to go back to. Nothing was changed."
      loop: "{{ old_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Confirmation (type ROLLBACK, or -e confirm_rollback=ROLLBACK)
      ansible.builtin.pause:
        prompt: "The app will use the old folders in the home folder again; changes made since the relocation stay on {{ storage_root }}. Type ROLLBACK"
      register: answer
      when: confirm_rollback is not defined

    - name: Require the confirmation
      ansible.builtin.assert:
        that: (confirm_rollback | default(answer.user_input | default(''))) == 'ROLLBACK'
        fail_msg: "Not confirmed. Nothing was changed."

    - name: Safety backup of the current state (stored on the disk, in {{ storage_root }}/backups)
      ansible.builtin.command: >-
        podman run {{ podman_run_flags }} {{ image_repo }}:current
        python manage.py backup_db --label pre-rollback-storage
      register: safety
      changed_when: "'BACKUP_CREATED' in safety.stdout"

    - name: Stop the daily backup timer and the app
      ansible.builtin.systemd:
        scope: user
        name: "{{ item }}"
        state: stopped
      loop:
        - "{{ app_name }}-backup.timer"
        - "{{ app_name }}.service"

    - name: Remember that the data is in the home folder again
      ansible.builtin.copy:
        dest: "{{ storage_marker }}"
        content: "legacy\n"
        mode: "0600"

    - name: Install the units and the wrapper for the old folders (without the /u01 guard, exactly as before)
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      vars:
        use_u01: false
      loop:
        - {src: tax-healthcare-tool.container.j2, dest: "{{ quadlet_dir }}/{{ app_name }}.container", mode: "0644"}
        - {src: tax-healthcare-tool-backup.service.j2, dest: "{{ unit_dir }}/{{ app_name }}-backup.service", mode: "0644"}
        - {src: manage.sh.j2, dest: "{{ bin_dir }}/{{ app_name }}-manage", mode: "0750"}

    - name: Reload systemd and start the app
      ansible.builtin.systemd:
        scope: user
        name: "{{ app_name }}.service"
        state: restarted
        daemon_reload: true

    - name: Start the daily backup timer again
      ansible.builtin.systemd:
        scope: user
        name: "{{ app_name }}-backup.timer"
        state: started

    - name: Wait until the container reports healthy
      ansible.builtin.command: "podman inspect --format {% raw %}'{{.State.Health.Status}}'{% endraw %} {{ container_name }}"
      register: health
      until: health.stdout == 'healthy'
      retries: 45
      delay: 4
      changed_when: false

    - name: The health endpoint answers on the loopback port
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health/"
        status_code: 200

    - name: Result
      ansible.builtin.debug:
        msg:
          - "The app uses {{ legacy_root }}/{data,uploads,backups} again."
          - "Safety backup of the state before the rollback: {{ (safety.stdout | default('')).strip() }} (in {{ storage_root }}/backups)"
          - "Next: set use_u01=false on the tax-service line of infra/inventory.ini (or remove it), or the next deploy refuses."
