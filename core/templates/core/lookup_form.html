{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ cfg.title }}{% endblock %}
{% block content %}
<p><a href="{% url kind|add:'_list' %}">&larr; {{ cfg.title }}</a></p>
<h1>{% if obj %}{% trans "Edit" %}{% else %}{% trans "Add" %}{% endif %} {{ cfg.singular }}</h1>
<form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<button type="submit">{% trans "Save" %}</button></form>
{% endblock %}
